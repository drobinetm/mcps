[project]
name = "gaceta-oficial-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar la Gaceta Oficial de Cuba (gacetaoficial.gob.cu)"
readme = "README.md"
authors = [
    { name = "Diovi", email = "drobinetm@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2,<3",
    "platformdirs>=4.12.3",
    "pypdf>=6.19.0",
    "selectolax>=1.0.0",
    "tzdata>=2026.5",
]

[project.scripts]
gaceta-oficial-mcp = "gaceta_oficial_mcp:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
